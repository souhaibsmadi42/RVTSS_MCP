<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RVTSS reel — render stage</title>
<style>
  :root {
    --bg: #06070c;
    --panel: #0f111b;
    --panel2: #151826;
    --line: #262a3f;
    --ink: #f3f5fb;
    --dim: #9aa3c7;
    --mute: #5d6485;
    --cyan: #00c6ff;
    --violet: #8b5cf6;
    --ok: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
    --grad: linear-gradient(90deg, #00c6ff 0%, #4f8bff 50%, #8b5cf6 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Inter', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* background */
  #grid { position: absolute; inset: -120px; opacity: .55;
    background-image:
      linear-gradient(rgba(120,140,220,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,140,220,.07) 1px, transparent 1px),
      linear-gradient(rgba(120,140,220,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,140,220,.035) 1px, transparent 1px);
    background-size: 240px 240px, 240px 240px, 60px 60px, 60px 60px; }
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .32; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); pointer-events: none; }

  /* HUD */
  #hud-left { left: 64px; top: 40px; display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  #hud-left .sub { font-weight: 500; color: var(--dim); }
  #hud-right { right: 64px; top: 44px; font-size: 16px; letter-spacing: .18em; color: var(--dim); text-align: right; }
  #hud-right b { color: var(--ink); font-weight: 700; }
  #progress { left: 64px; right: 64px; bottom: 34px; height: 4px; background: rgba(255,255,255,.07); border-radius: 2px; }
  #progress .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--grad); border-radius: 2px; }
  #progress .tick { position: absolute; top: -3px; width: 2px; height: 10px; background: rgba(255,255,255,.18); }
  #chapters { left: 64px; right: 64px; bottom: 46px; height: 18px; font-size: 12px; letter-spacing: .12em; color: var(--mute); }
  #chapters div { position: absolute; white-space: nowrap; transform: translateX(-50%); }
  #chapters div.on { color: var(--ink); }

  /* scenes */
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .card { position: absolute; background: linear-gradient(180deg, #121524, #0d0f19); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .win { position: absolute; background: #0c0e17; border: 1px solid #2a2f47; border-radius: 16px; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
  .win .bar { height: 46px; background: #151827; border-bottom: 1px solid #23273c; display: flex; align-items: center; padding: 0 18px; gap: 9px; font-size: 15px; color: var(--dim); }
  .win .dot { width: 12px; height: 12px; border-radius: 50%; background: #2c3150; }
  .win .bar .t { margin-left: 12px; letter-spacing: .02em; }
  .term { font-family: 'JetBrains Mono', monospace; font-size: 24px; line-height: 1.6; padding: 26px 30px; white-space: pre; color: #d9def0; }
  .term .p { color: var(--cyan); }
  .term .o { color: var(--mute); }
  .term .g { color: var(--ok); }
  .cursor { display: inline-block; width: 12px; height: 26px; background: var(--cyan); vertical-align: -4px; margin-left: 2px; }

  .stepcol { left: 120px; top: 230px; width: 560px; }
  .stepcol .k { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; letter-spacing: .3em; }
  .stepcol h2 { font-size: 76px; line-height: 1.04; font-weight: 800; letter-spacing: -.025em; margin-top: 18px; }
  .stepcol p { font-size: 26px; line-height: 1.45; color: var(--dim); margin-top: 26px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .crumb { font-size: 21px; font-weight: 600; padding: 10px 16px; border-radius: 10px; background: #141829; border: 1px solid #2a2f47; color: var(--ink); }
  .crumb.sep { background: none; border: none; color: var(--mute); padding: 10px 0; }

  .title { left: 120px; top: 150px; font-size: 64px; font-weight: 800; letter-spacing: -.02em; }
  .kicker { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: .3em; color: var(--cyan); }

  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; background: #121627; border: 1px solid #2a2f47; font-size: 24px; font-weight: 600; }
  .pill { font-family: 'JetBrains Mono', monospace; font-size: 18px; padding: 6px 12px; border-radius: 8px; background: rgba(0,198,255,.12); color: var(--cyan); font-weight: 700; letter-spacing: .06em; }
  .pill.v { background: rgba(139,92,246,.16); color: #b9a2ff; }
  .pill.ok { background: rgba(52,211,153,.14); color: var(--ok); }
  .pill.bad { background: rgba(248,113,113,.14); color: var(--bad); }
  .pill.warn { background: rgba(251,191,36,.14); color: var(--warn); }
  svg.ic { stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .hl { border-radius: 6px; padding: 0 4px; margin: 0 -4px; }
  /* reel */
  #bar { left: 60px; right: 60px; top: 70px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); }
  #bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--grad); }
  #cap { left: 110px; right: 110px; top: 1300px; display: flex; justify-content: center; }
  #cap .box { padding: 18px 30px; border-radius: 22px; background: rgba(6,7,12,.72); border: 1px solid rgba(255,255,255,.08);
    font-size: 62px; font-weight: 800; line-height: 1.18; letter-spacing: -.01em; text-align: center; max-width: 800px; }
  #cap .w { color: rgba(255,255,255,.55); }
  #cap .w.on { color: #fff; }
  #cap .w.now { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs" style="inset:0">
    <div id="grid"></div>
    <div id="g1" class="glow" style="width:900px;height:900px;background:#00c6ff"></div>
    <div id="g2" class="glow" style="width:1000px;height:1000px;background:#8b5cf6"></div>
  </div>
  <div id="scenes" class="abs" style="inset:0"></div>
  <div id="vignette"></div>
  <div id="hud" class="abs" style="inset:0"><div id="bar" class="abs"><div class="fill"></div></div><div id="cap" class="abs"></div></div>
</div>
</div>
<script type="module" src="scenes.js"></script>
</body>
</html>
