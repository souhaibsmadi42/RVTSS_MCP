[project]
name = "mcp-server-for-revit"
version = "2.0.0"
description = "RVTSS - MCP server for Autodesk Revit (pyRevit Routes): model intelligence, family creation, parameter management and BIM QC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # tools/_compat.py supports both the 1.x (FastMCP) and 2.x (MCPServer) SDK
    "mcp[cli]>=1.9.0,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[tool.setuptools.packages.find]
include = ["tools*", "revit_mcp*"]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pyflakes>=3.0",
    "vermin>=1.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a running Revit instance (slow)",
]
